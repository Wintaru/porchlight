packages:
  - apps/*
  - packages/*

# unrs-resolver's postinstall only picks the prebuilt native binding for this platform.
allowBuilds:
  unrs-resolver: true

# One version per dependency for the whole workspace. Packages reference these as
# `catalog:` so a version bump happens in exactly one place.
catalog:
  "@next/eslint-plugin-next": ^16.3.4
  "@playwright/test": ^1.63.0
  "@supabase/ssr": ^0.12.7
  "@supabase/supabase-js": ^2.116.0
  "@tiptap/core": ^3.31.3
  "@tiptap/extension-image": ^3.31.3
  "@tiptap/extensions": ^3.31.3
  "@tiptap/markdown": ^3.31.3
  "@tiptap/pm": ^3.31.3
  "@tiptap/react": ^3.31.3
  "@tiptap/starter-kit": ^3.31.3
  "@types/node": ^22.20.2
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@typescript-eslint/parser": ^8.70.0
  eslint: ^10.10.0
  eslint-config-prettier: ^10.1.8
  eslint-import-resolver-typescript: ^4.4.5
  eslint-plugin-boundaries: ^7.2.0
  jsdom: ^30.0.1
  jszip: ^3.10.1
  next: ^16.3.4
  postgres: ^3.4.9
  prettier: ^3.9.6
  react: ^19.3.0
  react-dom: ^19.3.0
  rehype-sanitize: ^6.0.0
  rehype-stringify: ^10.0.1
  remark-parse: ^11.0.0
  remark-rehype: ^11.1.2
  typescript: ^6.0.3
  typescript-eslint: ^8.70.0
  unified: ^11.0.5
  vite: ^8.3.0
  vitest: ^5.0.0
